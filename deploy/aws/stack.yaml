AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Food bank shift tracker: one Lightsail server with a static IP and daily snapshots,
  and an S3 bucket for nightly database backups with a key that can only add and read them.

Parameters:
  InstanceName:
    Type: String
    Default: mc-fd-dist
    Description: Names the static IP and the budget.
  ServerName:
    Type: String
    Default: mc-fd-dist
    Description: >-
      Names the Lightsail server. Give a new name to replace the server, because
      CloudFormation cannot replace a resource that keeps its name.
  AvailabilityZone:
    Type: String
    Default: us-west-2a
  BundleId:
    Type: String
    Description: Lightsail plan. List them with "aws lightsail get-bundles".
  SetupCommit:
    Type: String
    Description: Git commit whose deploy folder the server is set up from.
    AllowedPattern: "^[0-9a-f]{40}$"
  BackupRetentionDays:
    Type: Number
    Default: 365
    Description: How long nightly backups are kept in S3.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Receives a warning if monthly spend passes the budget. Leave empty for none.
  MonthlyBudget:
    Type: Number
    Default: 15

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  Server:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Ref ServerName
      AvailabilityZone: !Ref AvailabilityZone
      BlueprintId: ubuntu_24_04
      BundleId: !Ref BundleId
      AddOns:
        - AddOnType: AutoSnapshot
          Status: Enabled
          AutoSnapshotAddOnRequest:
            # 04:00 in Phoenix, after the nightly backup and the update window.
            SnapshotTimeOfDay: "11:00"
      Networking:
        Ports:
          - { Protocol: tcp, FromPort: 80, ToPort: 80, Cidrs: [0.0.0.0/0], Ipv6Cidrs: ["::/0"] }
          - { Protocol: tcp, FromPort: 443, ToPort: 443, Cidrs: [0.0.0.0/0], Ipv6Cidrs: ["::/0"] }
          - { Protocol: udp, FromPort: 443, ToPort: 443, Cidrs: [0.0.0.0/0], Ipv6Cidrs: ["::/0"] }
          # SSH only from the Lightsail console's browser client.
          - { Protocol: tcp, FromPort: 22, ToPort: 22, CidrListAliases: [lightsail-connect] }
      # Lightsail runs this after its own start-up lines, with sh rather than bash, so it
      # must work in sh. The set-up script itself runs in bash.
      UserData: !Sub |
        set -eu
        curl -fsSL "https://raw.githubusercontent.com/arkanwolfshade/mc-fd-dist/${SetupCommit}/deploy/server-setup.sh" -o /root/server-setup.sh
        bash /root/server-setup.sh "${SetupCommit}"
      Tags:
        - Key: app
          Value: mc-fd-dist

  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: !Sub "${InstanceName}-ip"
      AttachedTo: !Ref Server

  # Kept if the stack is deleted, so that removing the server never removes its backups.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >-
              Access logs would need a second bucket. One key writes here, it cannot
              delete, and versioning keeps every overwritten backup.
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            Prefix: nightly/
            ExpirationInDays: !Ref BackupRetentionDays
            # The last month stays in Standard. Older backups still restore at once.
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
            # As long as current backups, so that one overwritten by a stolen key survives.
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref BackupRetentionDays
      Tags:
        - Key: app
          Value: mc-fd-dist

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Lightsail servers cannot take an IAM role, so the server holds this user's key.
  # It can add and read backups but not list, delete or overwrite history, because the
  # bucket keeps every version. The key is created separately, so that its secret never
  # appears in the stack's outputs. The boundary, from github-deploy.yaml, caps what this
  # user can ever be given, so a change to this stack cannot turn it into an administrator.
  BackupWriter:
    Type: AWS::IAM::User
    Properties:
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${AWS::StackName}-backup-user-boundary"
      Policies:
        - PolicyName: nightly-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${BackupBucket.Arn}/nightly/*"

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${InstanceName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ServerName:
    Value: !Ref Server
  StaticIpAddress:
    Description: Point the site's DNS record here.
    Value: !GetAtt StaticIp.IpAddress
  BackupBucketName:
    Value: !Ref BackupBucket
  BackupWriterUserName:
    Value: !Ref BackupWriter

---
# Codacy reads this file from the default branch. Each exclusion below is for files that
# produced findings which are noise for this project, not for code worth reviewing.
engines:
  markdownlint:
    # The docs follow HADS (ADR 0018), whose block tags sit directly above lists. That
    # conflicts with markdownlint's blank-line rules, and `npm run docs:check` already checks
    # the docs' format, links and pictures.
    exclude_paths:
      - "docs/**"
  opengrep:
    # The hard-coded-password rule fires on the fixed passwords of test accounts, which the
    # tests need and which are never used outside them.
    exclude_paths:
      - "e2e/**"
      - "**/*.test.ts"
      - "server/test-support.ts"
  lizard:
    # Size and complexity are worth watching in the server and the client. Not in the browser
    # tests and walkthrough scripts, which are long by nature, or in a one-off icon generator.
    exclude_paths:
      - "e2e/**"
      - "scripts/**"

exclude_paths:
  # Generated by npm, and counted by Lizard as thousands of lines.
  - "package-lock.json"
  # A disclosure policy for people, not instructions for an agent. Agentlinter asks it for
  # priority labels and exceptions that would weaken it, and it has no agentlinter key to
  # exclude it from that tool alone.
  - "SECURITY.md"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a full commit, not a tag, because tags can be moved.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run docs:pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: printable-guides
          path: dist/guides/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck deploy/*.sh deploy/aws/*.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          config: .hadolint.yaml
          format: gnu
          output-file: hadolint.txt
          no-fail: true
      # Findings become annotations, which can be read without access to the job log.
      - run: |
          grep -v '^[[:space:]]*$' hadolint.txt > findings.txt || true
          while IFS= read -r line || [ -n "$line" ]; do
            echo "::error title=hadolint::$line"
          done < findings.txt
          [ ! -s findings.txt ]
      - run: pipx run cfn-lint --regions us-west-2 -- deploy/aws/*.yaml
      - run: pipx run checkov==3.4.3 --compact --quiet -d deploy/aws --framework cloudformation
      - run: pipx run checkov==3.4.3 --compact --quiet -f Dockerfile --framework dockerfile
      - run: docker build -t mc-fd-dist:ci .
      - id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: mc-fd-dist:ci
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: json
      # Fixable high and critical vulnerabilities fail the build, reported as annotations.
      - env:
          REPORT: ${{ steps.grype.outputs.json }}
        run: |
          jq -r '.matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | select(.vulnerability.fix.state == "fixed")
            | "\(.vulnerability.id) \(.vulnerability.severity) in \(.artifact.name) \(.artifact.version) (\(.artifact.type)), fixed in \(.vulnerability.fix.versions | join(", "))"' \
            "$REPORT" | sort -u > grype-findings.txt
          while IFS= read -r line || [ -n "$line" ]; do
            echo "::error title=Grype::$line"
          done < grype-findings.txt
          [ ! -s grype-findings.txt ]
      - run: deploy/smoke-test.sh mc-fd-dist:ci
      - run: deploy/dast.sh mc-fd-dist:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: container-logs
          path: |
            deploy/smoke-test.log
            deploy/zap/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the whole history, so that a secret committed and later removed is still found.
      - run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose

  # Publishes the image the server runs, only from main and only after every check passes.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, container, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - run: pipx run cfn-lint --regions us-west-2 -- deploy/aws/stack.yaml
      - run: docker build -t mc-fd-dist:ci .
      - run: deploy/smoke-test.sh mc-fd-dist:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-logs
          path: deploy/smoke-test.log
          retention-days: 7

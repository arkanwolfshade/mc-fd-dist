name: Accessibility barrier
description: Something in the app or the guides is hard or impossible for you to use.
title: "Accessibility: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. You do not need to find out why it happens or how to make it happen again. Tell us what you were trying to do and what got in the way.

        **This issue is public.** Please do not write anything about a Family, the initials of an intake volunteer, a password or a station login, and please do not attach screenshots of the food bank's live site.

        [Our accessibility file](https://github.com/arkanwolfshade/mc-fd-dist/blob/main/ACCESSIBILITY.md) lists what has been checked and what has not.
  - type: textarea
    id: trying
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where did it happen?
      options:
        - Front desk
        - Distribution
        - Admin
        - Wall display
        - Help or a guide
        - A printed or PDF guide
        - Installing the app, or working without a connection
        - Somewhere else
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: What device, browser and operating system were you using?
      placeholder: For example, an iPad with Safari
    validations:
      required: true
  - type: checkboxes
    id: technology
    attributes:
      label: Which of these do you use?
      description: Tick any that apply.
      options:
        - label: A screen reader
        - label: A screen magnifier, or browser zoom
        - label: Voice control
        - label: Keyboard only, with no mouse or touch
        - label: A switch, or another special way of giving input
        - label: High contrast, large text or other display settings
        - label: Reduced motion
  - type: input
    id: which
    attributes:
      label: Which one, and its version if you know it
      description: For example, VoiceOver on iPadOS, or NVDA with Firefox.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Did you find a way around it?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send it
      options:
        - label: I have left out details about Families and volunteers, passwords, and screenshots of the live site.
          required: true
